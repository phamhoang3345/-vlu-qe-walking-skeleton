<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập</title>
</head>
<body>
  <h1>Đăng nhập</h1>

  <form id="loginForm">
    <label>
      Username:
      <input type="text" id="username" required>
    </label>

    <br><br>

    <label>
      Password:
      <input type="password" id="password" required>
    </label>

    <br><br>

    <button type="submit">Đăng nhập</button>
  </form>

  <p id="message"></p>

  <script src="login.js"></script>
</body>
</html>
